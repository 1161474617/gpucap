[package]
name = "gpucap"
version = "0.2.0"
edition = "2021"
description = "面向黑屏/掉卡/驱动崩溃的长期后台采集器与实时原生监控界面"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui_extras = "0.29"
egui_plot = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.10"
chrono = "0.4"
regex = "1"
ctrlc = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tray-icon = "0.19"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
rust-embed = "8"
mime_guess = "2"
sysinfo = "0.40"
wmi = "0.18"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
