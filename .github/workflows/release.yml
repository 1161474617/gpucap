name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "手动发布版本号（例如 v0.3.0）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 桌面端与服务端
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: 构建 Vue 3 前端资源
        shell: pwsh
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 运行 Rust 单元测试
        run: cargo test --locked

      - name: 编译 Windows Release 二进制
        run: cargo build --release --locked

      - name: 整理 Windows 发布产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item target\release\gpucap.exe dist-win\gpucap.exe

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist-win/gpucap.exe

  build-android:
    name: 构建原生安卓 APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 配置 Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: 编译 Android Release APK
        run: gradle -p android-native assembleRelease

      - name: 整理 Android 发布产物
        run: |
          mkdir -p dist-android
          cp android-native/app/build/outputs/apk/release/app-release.apk dist-android/gpucap-android-native.apk

      - name: 上传 Android 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist-android/gpucap-android-native.apk

  build-macos:
    name: 构建 macOS 客户端 (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行 macOS 打包脚本
        run: |
          chmod +x macos/build_arm64.sh
          ./macos/build_arm64.sh

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: macos/dist/GPUCap-macos-arm64.zip

  publish-release:
    name: 发布 GitHub Release
    needs: [build-windows, build-android, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 确定发布 Tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "GPUCap ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            release-assets/gpucap.exe
            release-assets/gpucap-android-native.apk
            release-assets/GPUCap-macos-arm64.zip
